<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>claim-worker relationship graph</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 12px;
    color: #111827;
    background: #fafafa;
  }
  h1 { font-size: 15px; margin: 0 0 8px; }
  #summary {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 13px;
    margin-bottom: 10px;
    color: #374151;
  }
  #summary span { white-space: nowrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
  #status {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 8px;
  }
  .demo-btn {
    font-size: 12px;
    padding: 3px 8px;
    border: 1px solid #d1d5db;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
    margin-right: 6px;
  }
  svg { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; }
  .node-label { font-size: 11px; fill: #111827; pointer-events: none; }
  .edge-label { font-size: 9px; fill: #6b7280; }
</style>
</head>
<body>
  <h1 id="title">claim-worker relationship graph</h1>
  <div id="status">
    <span id="status-text">Waiting for LangSmith postMessage data&hellip;</span>
    <button id="demo-output-btn" class="demo-btn" type="button">Load demo output</button>
    <button id="demo-reference-btn" class="demo-btn" type="button">Load demo reference</button>
  </div>
  <div id="summary"></div>
  <svg id="graph" width="760" height="520"></svg>

<script>
(function () {
  "use strict";

  // IMPORTANT: LangSmith's "Output" and "Reference Outputs" panels each load
  // this page as an INDEPENDENT iframe. Each instance only ever receives ONE
  // message type ("output" XOR "reference") -- the two panels do not share a
  // JS context, so this page can never see both together. It therefore just
  // renders whichever single dataset it was given, with no cross-panel diff.
  var state = { kind: null, data: null, inputs: null };

  window.addEventListener("message", function (event) {
    var msg = event.data;
    if (!msg || typeof msg !== "object" || !msg.type) return;
    if (msg.type !== "output" && msg.type !== "reference") return;
    state.kind = msg.type;
    state.data = msg.data;
    if (msg.metadata && msg.metadata.inputs) state.inputs = msg.metadata.inputs;
    setStatus("Received " + msg.type + " message");
    render();
  });

  function setStatus(text) {
    document.getElementById("status-text").textContent = text;
  }

  var DEMO_INPUTS = {
    claims: {
      "C-001": {
        subject_node_name: "Sidewall",
        statement: "Cyclic flexing of the tire sidewall nucleates micro-cracks at the filler/matrix interface.",
        conditions: ["sidewall flexed at high frequency", "ambient temperature below 0 C"]
      },
      "C-002": {
        subject_node_name: "Sidewall",
        statement: "Repeated bending of the sidewall nucleates micro-cracks where filler meets the matrix.",
        conditions: ["sidewall bent repeatedly", "sub-freezing ambient temperature"]
      },
      "C-003": {
        subject_node_name: "Tread",
        statement: "Prolonged UV exposure oxidizes the tread rubber surface, increasing stiffness.",
        conditions: ["prolonged UV exposure", "outdoor storage"]
      }
    },
    stressors: {
      "stressor:cold-ambient": {
        name: "Cold ambient temperature",
        description: "Sub-freezing air temperature encountered during winter rides."
      }
    }
  };

  // ---- demo data (mirrors eval_data/claim_worker_relationships/tire_sidewall_duplicate_stressor.yaml) ----
  document.getElementById("demo-output-btn").addEventListener("click", function () {
    state.inputs = DEMO_INPUTS;
    state.kind = "output";
    state.data = {
      status: "complete",
      total_tool_calls: 3,
      meta_claims: [
        {
          meta_claim_id: "mc-1", claim_a_id: "C-001", claim_b_id: "C-002", relationship: "duplicates",
          statement: "Same mechanism, different wording.", reasoning: "Both describe sidewall micro-crack nucleation under cyclic/repeated flexing."
        },
        {
          meta_claim_id: "mc-2", claim_a_id: "C-001", claim_b_id: "C-003", relationship: "is_subset_of",
          statement: "Agent-proposed relationship.", reasoning: "Shown exactly as the agent recorded it -- this page has no answer key to grade it against."
        }
      ],
      stressor_edges: [
        {
          stressor_id: "stressor:cold-ambient", claim_id: "C-001",
          satisfies_conditions: ["ambient temperature below 0 C"]
        }
      ]
    };
    setStatus("Loaded demo output");
    render();
  });

  document.getElementById("demo-reference-btn").addEventListener("click", function () {
    state.inputs = DEMO_INPUTS;
    state.kind = "reference";
    state.data = {
      expected: {
        duplicates: [["C-001", "C-002"]],
        must_not_merge: [],
        causes: [],
        is_subset_of: [],
        must_not_link: [["C-002", "C-003"]],
        stressor_supplies: [{ stressor_id: "stressor:cold-ambient", claim_id_any_of: ["C-001", "C-002"] }]
      }
    };
    setStatus("Loaded demo reference");
    render();
  });

  // ---- build a plain (non-diffed) edge list from whichever dataset this page has ----

  function edgesFromOutput(data) {
    var meta = (data && data.meta_claims) || [];
    var stressorEdges = (data && data.stressor_edges) || [];
    var edges = meta.map(function (m) {
      return {
        a: m.claim_a_id, b: m.claim_b_id, rel: m.relationship,
        directed: m.relationship !== "duplicates", kind: "relationship",
        tooltip: m.statement || m.reasoning || m.relationship
      };
    });
    stressorEdges.forEach(function (e) {
      edges.push({
        a: e.stressor_id, b: e.claim_id, rel: "supplies", directed: true, kind: "relationship",
        tooltip: (e.satisfies_conditions || []).join("; ") || "supplies"
      });
    });
    return edges;
  }

  function edgesFromReference(data) {
    var expected = (data && data.expected) || {};
    var edges = [];
    (expected.duplicates || []).forEach(function (pair) {
      edges.push({ a: pair[0], b: pair[1], rel: "duplicates", directed: false, kind: "relationship", tooltip: "duplicates" });
    });
    (expected.causes || []).forEach(function (rel) {
      edges.push({ a: rel.claim_a_id, b: rel.claim_b_id, rel: "causes", directed: true, kind: "relationship", tooltip: "causes" });
    });
    (expected.is_subset_of || []).forEach(function (rel) {
      edges.push({ a: rel.claim_a_id, b: rel.claim_b_id, rel: "is_subset_of", directed: true, kind: "relationship", tooltip: "is_subset_of" });
    });
    (expected.must_not_merge || []).forEach(function (pair) {
      edges.push({ a: pair[0], b: pair[1], rel: "must_not_merge", directed: false, kind: "constraint", tooltip: "must NOT be merged as duplicates" });
    });
    (expected.must_not_link || []).forEach(function (pair) {
      edges.push({ a: pair[0], b: pair[1], rel: "must_not_link", directed: false, kind: "constraint", tooltip: "must NOT be linked at all" });
    });
    (expected.stressor_supplies || []).forEach(function (supply) {
      (supply.claim_id_any_of || []).forEach(function (cid) {
        edges.push({ a: supply.stressor_id, b: cid, rel: "supplies (any of)", directed: true, kind: "relationship", tooltip: "any one of these claims must be supplied" });
      });
    });
    return edges;
  }

  // ---- rendering ----

  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  var REL_COLOR = "#2563eb";   // positive relationship edge
  var CONSTRAINT_COLOR = "#6b7280"; // "must not" constraint edge

  function render() {
    var svg = document.getElementById("graph");
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    var width = +svg.getAttribute("width");
    var height = +svg.getAttribute("height");

    var defs = el("defs", {});
    [["rel", REL_COLOR], ["constraint", CONSTRAINT_COLOR]].forEach(function (pair) {
      var marker = el("marker", {
        id: "arrow-" + pair[0], viewBox: "0 0 10 10", refX: "9", refY: "5",
        markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse"
      });
      marker.appendChild(el("path", { d: "M0,0 L10,5 L0,10 z", fill: pair[1] }));
      defs.appendChild(marker);
    });
    svg.appendChild(defs);

    document.getElementById("title").textContent =
      state.kind === "output" ? "claim-worker relationship graph \u2014 Output (agent's run)" :
      state.kind === "reference" ? "claim-worker relationship graph \u2014 Reference (answer key)" :
      "claim-worker relationship graph";

    var claims = (state.inputs && state.inputs.claims) || {};
    var stressors = (state.inputs && state.inputs.stressors) || {};
    var claimIds = Object.keys(claims);
    var stressorIds = Object.keys(stressors);

    if (!claimIds.length) {
      svg.appendChild(el("text", { x: 16, y: 28, "class": "node-label" })).textContent =
        "No inputs.claims received yet -- click a demo button above, or point this page at a real dataset example.";
      renderSummary([]);
      return;
    }

    var cx = width / 2, cy = height / 2 - 40, r = Math.min(width, height - 160) / 2 - 40;
    var pos = {};
    claimIds.forEach(function (id, i) {
      var angle = (2 * Math.PI * i) / claimIds.length - Math.PI / 2;
      pos[id] = { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle), kind: "claim" };
    });
    var sy = height - 60;
    var sSpacing = width / (stressorIds.length + 1);
    stressorIds.forEach(function (id, i) {
      pos[id] = { x: sSpacing * (i + 1), y: sy, kind: "stressor" };
    });

    var edges = state.kind === "output" ? edgesFromOutput(state.data) :
      state.kind === "reference" ? edgesFromReference(state.data) : [];

    var edgeLayer = el("g", {});
    svg.appendChild(edgeLayer);
    edges.forEach(function (e) {
      drawEdge(edgeLayer, pos[e.a], pos[e.b], e);
    });

    var nodeLayer = el("g", {});
    svg.appendChild(nodeLayer);
    claimIds.forEach(function (id) {
      drawNode(nodeLayer, pos[id], id, claims[id], "claim");
    });
    stressorIds.forEach(function (id) {
      drawNode(nodeLayer, pos[id], id, stressors[id], "stressor");
    });

    renderSummary(edges);
  }

  function drawEdge(layer, p1, p2, e) {
    if (!p1 || !p2) return;
    var color = e.kind === "constraint" ? CONSTRAINT_COLOR : REL_COLOR;
    var dash = e.kind === "constraint" ? "6,4" : "none";
    var line = el("line", {
      x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
      stroke: color, "stroke-width": 2, "stroke-dasharray": dash
    });
    if (e.directed) line.setAttribute("marker-end", "url(#arrow-" + (e.kind === "constraint" ? "constraint" : "rel") + ")");
    var title = el("title", {});
    title.textContent = e.rel + ": " + e.tooltip;
    line.appendChild(title);
    layer.appendChild(line);

    var mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
    var label = el("text", { x: mx, y: my, "class": "edge-label", "text-anchor": "middle" });
    label.textContent = e.rel;
    layer.appendChild(label);
  }

  function drawNode(layer, p, id, data, kind) {
    var g = el("g", { transform: "translate(" + p.x + "," + p.y + ")" });
    var label = (data && (data.name || data.statement || data.subject_node_name)) || id;
    var tooltip = (data && data.statement) ? data.statement : label;

    if (kind === "stressor") {
      g.appendChild(el("rect", { x: -24, y: -14, width: 48, height: 28, rx: 4, fill: "#ede9fe", stroke: "#7c3aed", "stroke-width": 1.5 }));
    } else {
      g.appendChild(el("circle", { r: 20, fill: "#dbeafe", stroke: "#2563eb", "stroke-width": 1.5 }));
    }
    var title = el("title", {});
    title.textContent = id + ": " + tooltip;
    g.appendChild(title);

    var text = el("text", { x: 0, y: 4, "text-anchor": "middle", "class": "node-label" });
    text.textContent = id;
    g.appendChild(text);

    layer.appendChild(g);
  }

  function renderSummary(edges) {
    var relCount = edges.filter(function (e) { return e.kind === "relationship"; }).length;
    var constraintCount = edges.filter(function (e) { return e.kind === "constraint"; }).length;
    var el_ = document.getElementById("summary");
    el_.innerHTML =
      '<span><span class="dot" style="background:' + REL_COLOR + '"></span>' + relCount + " relationship edge(s)</span>" +
      '<span><span class="dot" style="background:' + CONSTRAINT_COLOR + '"></span>' + constraintCount + " constraint edge(s) (reference only)</span>";
  }

  render();
})();
</script>
</body>
</html>

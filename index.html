<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>claim-worker relationship diff</title>
<style>
  :root {
    --correct: #22c55e;
    --missing: #ef4444;
    --violation: #dc2626;
    --extra: #9ca3af;
    --claim-fill: #dbeafe;
    --claim-stroke: #2563eb;
    --stressor-fill: #ede9fe;
    --stressor-stroke: #7c3aed;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 12px;
    color: #111827;
    background: #fafafa;
  }
  h1 { font-size: 15px; margin: 0 0 8px; }
  #summary {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 13px;
    margin-bottom: 10px;
  }
  #summary span { white-space: nowrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
  #status {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 8px;
  }
  #demo-btn {
    font-size: 12px;
    padding: 3px 8px;
    border: 1px solid #d1d5db;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }
  svg { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; }
  .node-label { font-size: 11px; fill: #111827; pointer-events: none; }
  .edge-label { font-size: 9px; fill: #6b7280; }
</style>
</head>
<body>
  <h1>claim-worker relationship diff (actual vs. reference)</h1>
  <div id="status">Waiting for LangSmith postMessage data&hellip;
    <button id="demo-btn" type="button">Load demo data</button>
  </div>
  <div id="summary"></div>
  <svg id="graph" width="760" height="520"></svg>

<script>
(function () {
  "use strict";

  // Latest message of each type received so far. LangSmith retries delivery
  // (up to 6x, exponential backoff) and sends "output"/"reference" as
  // separate events -- we hold onto whichever has arrived and re-render
  // every time a new one comes in, rather than requiring both up front.
  var received = { output: null, reference: null, inputs: null };

  window.addEventListener("message", function (event) {
    var msg = event.data;
    if (!msg || typeof msg !== "object" || !msg.type) return;
    if (msg.type === "output") received.output = msg.data;
    else if (msg.type === "reference") received.reference = msg.data;
    if (msg.metadata && msg.metadata.inputs) received.inputs = msg.metadata.inputs;
    setStatus(
      "Received " + msg.type + " message" +
      (received.output ? " \u2713output" : "") +
      (received.reference ? " \u2713reference" : "")
    );
    render();
  });

  function setStatus(text) {
    var btn = document.getElementById("demo-btn");
    document.getElementById("status").textContent = text + " ";
    document.getElementById("status").appendChild(btn);
  }

  // ---- demo data (mirrors eval_data/claim_worker_relationships/tire_sidewall_duplicate_stressor.yaml) ----
  document.getElementById("demo-btn").addEventListener("click", function () {
    received.inputs = {
      claims: {
        "C-001": {
          subject_node_name: "Sidewall",
          statement: "Cyclic flexing of the tire sidewall nucleates micro-cracks at the filler/matrix interface.",
          conditions: ["sidewall flexed at high frequency", "ambient temperature below 0 C"]
        },
        "C-002": {
          subject_node_name: "Sidewall",
          statement: "Repeated bending of the sidewall nucleates micro-cracks where filler meets the matrix.",
          conditions: ["sidewall bent repeatedly", "sub-freezing ambient temperature"]
        },
        "C-003": {
          subject_node_name: "Tread",
          statement: "Prolonged UV exposure oxidizes the tread rubber surface, increasing stiffness.",
          conditions: ["prolonged UV exposure", "outdoor storage"]
        }
      },
      stressors: {
        "stressor:cold-ambient": {
          name: "Cold ambient temperature",
          description: "Sub-freezing air temperature encountered during winter rides."
        }
      }
    };
    received.reference = {
      expected: {
        duplicates: [["C-001", "C-002"]],
        must_not_merge: [],
        causes: [],
        is_subset_of: [],
        must_not_link: [["C-002", "C-003"]],
        stressor_supplies: [{ stressor_id: "stressor:cold-ambient", claim_id_any_of: ["C-001", "C-002"] }]
      }
    };
    // A simulated ACTUAL run: correctly found the duplicate, correctly
    // avoided linking C-002/C-003, supplied the stressor to C-001 only
    // (misses C-002 as an acceptable alternative target -- still "correct"
    // per claim_id_any_of), and threw in one unscored extra relationship.
    received.output = {
      status: "complete",
      total_tool_calls: 3,
      meta_claims: [
        {
          meta_claim_id: "mc-1", claim_a_id: "C-001", claim_b_id: "C-002", relationship: "duplicates",
          statement: "Same mechanism, different wording.", reasoning: "Both describe sidewall micro-crack nucleation under cyclic/repeated flexing."
        },
        {
          meta_claim_id: "mc-2", claim_a_id: "C-001", claim_b_id: "C-003", relationship: "is_subset_of",
          statement: "Not actually scored by this case's answer key.", reasoning: "Included to demonstrate an 'extra' (unscored) edge."
        }
      ],
      stressor_edges: [
        {
          stressor_id: "stressor:cold-ambient", claim_id: "C-001",
          satisfies_conditions: ["ambient temperature below 0 C"]
        }
      ]
    };
    setStatus("Loaded demo data");
    render();
  });

  // ---- diff logic (mirrors trc/evals/langsmith_eval.py's _relationships_correct / _stressor_supplies_correct) ----

  function pairKey(a, b) {
    return [a, b].sort().join("|");
  }

  function computeDiff() {
    var meta = (received.output && received.output.meta_claims) || [];
    var stressorEdges = (received.output && received.output.stressor_edges) || [];
    var expected = (received.reference && received.reference.expected) || {};

    var directed = {};
    var duplicatePairs = {};
    var anyLinkedPairs = {};
    meta.forEach(function (m) {
      directed[m.claim_a_id + ">>" + m.claim_b_id + ">>" + m.relationship] = true;
      var k = pairKey(m.claim_a_id, m.claim_b_id);
      anyLinkedPairs[k] = true;
      if (m.relationship === "duplicates") duplicatePairs[k] = true;
    });

    var covered = {}; // pairKey or directed-key already drawn by an expected check
    var edges = [];

    (expected.duplicates || []).forEach(function (pair) {
      var k = pairKey(pair[0], pair[1]);
      covered[k] = true;
      edges.push({ a: pair[0], b: pair[1], rel: "duplicates", directed: false, status: duplicatePairs[k] ? "correct" : "missing" });
    });
    (expected.must_not_merge || []).forEach(function (pair) {
      var k = pairKey(pair[0], pair[1]);
      covered[k] = true;
      if (duplicatePairs[k]) edges.push({ a: pair[0], b: pair[1], rel: "must_not_merge", directed: false, status: "violation" });
    });
    (expected.causes || []).forEach(function (rel) {
      var dk = rel.claim_a_id + ">>" + rel.claim_b_id + ">>causes";
      covered[dk] = true;
      edges.push({ a: rel.claim_a_id, b: rel.claim_b_id, rel: "causes", directed: true, status: directed[dk] ? "correct" : "missing" });
    });
    (expected.is_subset_of || []).forEach(function (rel) {
      var dk = rel.claim_a_id + ">>" + rel.claim_b_id + ">>is_subset_of";
      covered[dk] = true;
      edges.push({ a: rel.claim_a_id, b: rel.claim_b_id, rel: "is_subset_of", directed: true, status: directed[dk] ? "correct" : "missing" });
    });
    (expected.must_not_link || []).forEach(function (pair) {
      var k = pairKey(pair[0], pair[1]);
      covered[k] = true;
      if (anyLinkedPairs[k]) edges.push({ a: pair[0], b: pair[1], rel: "must_not_link", directed: false, status: "violation" });
    });

    // Anything the agent recorded that none of the expected checks above
    // already drew -- shown as neutral/"extra" so it's visible but not
    // scored, matching the fact the Python scorer never looks at it either.
    meta.forEach(function (m) {
      var k = pairKey(m.claim_a_id, m.claim_b_id);
      var dk = m.claim_a_id + ">>" + m.claim_b_id + ">>" + m.relationship;
      if (covered[k] || covered[dk]) return;
      edges.push({ a: m.claim_a_id, b: m.claim_b_id, rel: m.relationship, directed: m.relationship !== "duplicates", status: "extra" });
    });

    // Stressor-supply edges.
    var stressorEdgeList = [];
    var stressorCovered = {};
    (expected.stressor_supplies || []).forEach(function (supply) {
      var candidates = supply.claim_id_any_of || [];
      var hit = stressorEdges.find(function (e) {
        return e.stressor_id === supply.stressor_id && candidates.indexOf(e.claim_id) !== -1;
      });
      candidates.forEach(function (cid) {
        stressorCovered[supply.stressor_id + ">>" + cid] = true;
      });
      if (hit) {
        stressorEdgeList.push({ stressor: supply.stressor_id, claim: hit.claim_id, status: "correct" });
      } else if (candidates.length) {
        // Not satisfied -- show the required target(s) as missing so it's
        // clear which claim(s) would have made this pass.
        candidates.forEach(function (cid) {
          stressorEdgeList.push({ stressor: supply.stressor_id, claim: cid, status: "missing" });
        });
      }
    });
    stressorEdges.forEach(function (e) {
      var k = e.stressor_id + ">>" + e.claim_id;
      if (!stressorCovered[k]) stressorEdgeList.push({ stressor: e.stressor_id, claim: e.claim_id, status: "extra" });
    });

    return { edges: edges, stressorEdgeList: stressorEdgeList };
  }

  // ---- rendering ----

  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  var STATUS_COLOR = { correct: "var(--correct)", missing: "var(--missing)", violation: "var(--violation)", extra: "var(--extra)" };
  var STATUS_DASH = { correct: "none", missing: "6,4", violation: "none", extra: "3,3" };

  function render() {
    var svg = document.getElementById("graph");
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    var width = +svg.getAttribute("width");
    var height = +svg.getAttribute("height");

    // Arrowhead marker defs, one per status color (SVG markers can't use CSS vars reliably across browsers).
    var colorMap = { correct: "#22c55e", missing: "#ef4444", violation: "#dc2626", extra: "#9ca3af" };
    var defs = el("defs", {});
    Object.keys(colorMap).forEach(function (status) {
      var marker = el("marker", {
        id: "arrow-" + status, viewBox: "0 0 10 10", refX: "9", refY: "5",
        markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse"
      });
      marker.appendChild(el("path", { d: "M0,0 L10,5 L0,10 z", fill: colorMap[status] }));
      defs.appendChild(marker);
    });
    svg.appendChild(defs);

    var claims = (received.inputs && received.inputs.claims) || {};
    var stressors = (received.inputs && received.inputs.stressors) || {};
    var claimIds = Object.keys(claims);
    var stressorIds = Object.keys(stressors);

    if (!claimIds.length) {
      svg.appendChild(el("text", { x: 16, y: 28, "class": "node-label" })).textContent =
        "No inputs.claims received yet -- click \u201cLoad demo data\u201d or point this page at a real dataset example.";
      renderSummary({ edges: [], stressorEdgeList: [] });
      return;
    }

    // Claims laid out on a circle in the upper region; stressors in a row below.
    var cx = width / 2, cy = height / 2 - 40, r = Math.min(width, height - 160) / 2 - 40;
    var pos = {};
    claimIds.forEach(function (id, i) {
      var angle = (2 * Math.PI * i) / claimIds.length - Math.PI / 2;
      pos[id] = { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle), kind: "claim" };
    });
    var sy = height - 60;
    var sSpacing = width / (stressorIds.length + 1);
    stressorIds.forEach(function (id, i) {
      pos[id] = { x: sSpacing * (i + 1), y: sy, kind: "stressor" };
    });

    var diff = computeDiff();

    // Draw edges first so nodes render on top.
    var edgeLayer = el("g", {});
    svg.appendChild(edgeLayer);
    diff.edges.forEach(function (e) {
      drawEdge(edgeLayer, pos[e.a], pos[e.b], e.status, e.rel, e.directed);
    });
    diff.stressorEdgeList.forEach(function (e) {
      drawEdge(edgeLayer, pos[e.stressor], pos[e.claim], e.status, "supplies", true);
    });

    // Nodes.
    var nodeLayer = el("g", {});
    svg.appendChild(nodeLayer);
    claimIds.forEach(function (id) {
      drawNode(nodeLayer, pos[id], id, claims[id], "claim");
    });
    stressorIds.forEach(function (id) {
      drawNode(nodeLayer, pos[id], id, stressors[id], "stressor");
    });

    renderSummary(diff);
  }

  function drawEdge(layer, p1, p2, status, rel, directed) {
    if (!p1 || !p2) return;
    var color = { correct: "#22c55e", missing: "#ef4444", violation: "#dc2626", extra: "#9ca3af" }[status] || "#9ca3af";
    var dash = { correct: "none", missing: "6,4", violation: "none", extra: "3,3" }[status] || "none";
    var line = el("line", {
      x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
      stroke: color, "stroke-width": status === "violation" ? 3 : 2, "stroke-dasharray": dash
    });
    if (directed) line.setAttribute("marker-end", "url(#arrow-" + status + ")");
    var title = el("title", {});
    title.textContent = rel + " (" + status + "): " + p1.x + "," + p1.y;
    line.appendChild(title);
    layer.appendChild(line);

    var mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
    var label = el("text", { x: mx, y: my, "class": "edge-label", "text-anchor": "middle" });
    label.textContent = rel;
    layer.appendChild(label);
  }

  function drawNode(layer, p, id, data, kind) {
    var g = el("g", { transform: "translate(" + p.x + "," + p.y + ")" });
    var label = (data && (data.name || data.statement || data.subject_node_name)) || id;
    var tooltip = (data && data.statement) ? data.statement : label;

    if (kind === "stressor") {
      g.appendChild(el("rect", { x: -24, y: -14, width: 48, height: 28, rx: 4, fill: "#ede9fe", stroke: "#7c3aed", "stroke-width": 1.5 }));
    } else {
      g.appendChild(el("circle", { r: 20, fill: "#dbeafe", stroke: "#2563eb", "stroke-width": 1.5 }));
    }
    var title = el("title", {});
    title.textContent = id + ": " + tooltip;
    g.appendChild(title);

    var text = el("text", { x: 0, y: 4, "text-anchor": "middle", "class": "node-label" });
    text.textContent = id;
    g.appendChild(text);

    layer.appendChild(g);
  }

  function renderSummary(diff) {
    var counts = { correct: 0, missing: 0, violation: 0, extra: 0 };
    diff.edges.concat(diff.stressorEdgeList).forEach(function (e) {
      counts[e.status] = (counts[e.status] || 0) + 1;
    });
    var el_ = document.getElementById("summary");
    el_.innerHTML =
      '<span><span class="dot" style="background:#22c55e"></span>' + counts.correct + " correct</span>" +
      '<span><span class="dot" style="background:#ef4444"></span>' + counts.missing + " missing</span>" +
      '<span><span class="dot" style="background:#dc2626"></span>' + counts.violation + " violations</span>" +
      '<span><span class="dot" style="background:#9ca3af"></span>' + counts.extra + " extra (unscored)</span>";
  }

  render();
})();
</script>
</body>
</html>
